spring.application.name=boutique-api
spring.profiles.active=dev

# Base de données (modifiable par variables d'environnement)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boutique}
spring.datasource.username=${DB_USER:boutique}
spring.datasource.password=${DB_PASSWORD:boutique}

# Le schéma est géré par Flyway : Hibernate se contente de le vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Jeton JWT : au moins 32 caractères. En production, fournis JWT_SECRET par variable d'environnement.
app.jwt.secret=${JWT_SECRET:cle-de-developpement-uniquement-a-remplacer-en-production-0123456789}
app.jwt.expiration-minutes=480

# Origines autorisées à appeler l'API (l'application Angular)
app.cors.allowed-origins=http://localhost:4200